{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel" role="alert">
  <p class="muted">Error {{ status_code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="actions"><a class="btn btn-primary" href="{{ back_url }}">{{ back_label }}</a></div>
</section>
{% endblock %}
